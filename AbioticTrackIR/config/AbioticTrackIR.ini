; =====================================================================
; Abiotic Factor - TrackIR & OpenTrack 6-DOF + Parallax 3D Mod Config
; =====================================================================

[General]
; Master toggle for head tracking
Enabled = true
; If false (default), mouse aims weapon/reticle while head tracking independently controls view perspective
; If true, head tracking also injects deltas into weapon aim direction
AimCoupled = false
; Pause camera tracking perturbations when mouse cursor is active in inventory/crafting menus
PauseInMenus = true
; Port used if OpenTrack is set to output via UDP
UdpPort = 4242

[Sensitivity]
; Rotation sensitivity multipliers (Pitch, Yaw, Roll)
Yaw = 1.0
Pitch = 1.0
Roll = 0.8
; Translation sensitivity multipliers (X = Lateral Left/Right, Y = Vertical Up/Down, Z = Depth Forward/Back)
X = 1.0
Y = 1.0
Z = 1.0
; Dynamically scale sensitivity when aiming down sights (ADS) with scoped weapons
ScaleSensWithFOV = true

[Limits]
; Maximum physical translation in centimeters to prevent clipping through walls
MaxTranslationX_Cm = 25.0
MaxTranslationY_Cm = 30.0
MaxTranslationZ_Cm = 25.0

[Inversion]
; Invert individual tracking axes (true / false)
InvertYaw = false
InvertPitch = false
InvertRoll = false
InvertX = false
InvertY = false
InvertZ = false

[Smoothing]
; Adaptive exponential smoothing (0.0 = completely raw, 0.7 = heavy smoothing)
Factor = 0.35
; Deadzones to prevent micro-tremors when resting head
DeadzoneDegrees = 0.1
DeadzoneTransCm = 0.05

[NeckModel]
; Simulates human cervical neck pivot offset (eyes rotate around neck)
; Disabled by default in FPS games to prevent camera from clipping inside character mesh
Enabled = false
PivotForwardCm = -1.5
PivotUpCm = -2.0

[Parallax3D]
; Side quest: Off-axis perspective projection creating the illusion of 3D depth.
; Disabled by default to provide pure, comfortable, nausea-free 6-DOF tracking!
; Can be toggled on/off in-game anytime by pressing F10.
Enabled = false
; Physical monitor dimensions in centimeters (measure screen bezel-to-bezel)
; Presets: 24" = 53.1x29.9 | 27" = 59.7x33.6 | 32" = 69.8x39.3 | 34" UW = 79.8x33.4
MonitorWidthCm = 59.7
MonitorHeightCm = 33.6
; Distance from player's eyes to the monitor center in centimeters
ViewingDistanceCm = 65.0
; Subtle parallax projection shearing strength (calibrated to eliminate motion sickness)
Intensity = 0.10
; Expands field of view naturally when leaning closer to the display (disabled by default to prevent dolly-zoom vertigo)
DynamicFOV = false
; Safety limit on asymmetric frustum skew
MaxOffsetFrustum = 0.15
; Invert horizontal/vertical parallax projection shear
InvertParallaxX = false
InvertParallaxY = false

[Hotkeys]
; Key bindings (VK_F1 to VK_F12, LeftAlt, LeftCtrl, LeftShift, MiddleMouse, Mouse4, Mouse5)
Center = VK_F12
ToggleTracking = VK_F11
ToggleParallax = VK_F10
Freelook = VK_LMENU
